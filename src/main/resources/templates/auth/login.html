<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Career Vault</title>
    <link rel="stylesheet" th:href="@{/vendor/tabler/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/tabler/tabler-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <h1 class="h2 mb-1">
                <i class="ti ti-shield-lock me-2"></i>Career Vault
            </h1>
            <p class="text-secondary mb-0">Job Application Tracker &amp; Document Vault</p>
        </div>
        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4">Sign in to your account</h2>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="ti ti-alert-circle me-1"></i>Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    <i class="ti ti-check me-1"></i>You have been signed out.
                </div>

                <form th:action="@{/login}" method="post" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input id="username" type="text" name="username" class="form-control"
                               placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" type="password" name="password" class="form-control"
                               placeholder="Enter password" required>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="ti ti-lock me-1"></i>Sign in
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div class="text-center text-secondary mt-3">
            <button type="button" class="btn btn-ghost-secondary btn-sm" data-theme-toggle>
                <i class="ti ti-moon me-1"></i>Toggle dark mode
            </button>
        </div>
    </div>
</div>
<script th:src="@{/vendor/tabler/tabler.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
