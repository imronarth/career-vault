<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + ${status ?: ''} + ' - Career Vault'">Error - Career Vault</title>
    <link rel="stylesheet" th:href="@{/vendor/tabler/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/tabler/tabler-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="border-top-wide border-primary d-flex flex-column">
<div class="page page-center">
    <div class="container-tight py-4">
        <div class="empty">
            <div class="empty-header" th:text="${status ?: 500}">500</div>
            <p class="empty-title">Oops, something went wrong</p>
            <p class="empty-subtitle text-secondary"
               th:text="${message ?: 'An unexpected error occurred. Please try again.'}">
                An unexpected error occurred. Please try again.
            </p>
            <div class="empty-action">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="ti ti-arrow-left me-1"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendor/tabler/tabler.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
